# Render PostgreSQL Database Configuration
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${RENDER_DB_URL:jdbc:postgresql://localhost:5432/dateon}
spring.datasource.username=${RENDER_DB_USER:dateon_user}
spring.datasource.password=${RENDER_DB_PASS:}

# Update schema automatically without dropping existing data
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
