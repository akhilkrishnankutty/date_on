# Render PostgreSQL Database Configuration
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${DATABASE_URL:${DB_URL:${SPRING_DATASOURCE_URL:}}}
spring.datasource.username=${DB_USER:${SPRING_DATASOURCE_USERNAME:dateon_user}}
spring.datasource.password=${DB_PASS:${RENDER_DB_PASSWORD:}}

# Create schema and automatically execute import.sql
spring.jpa.hibernate.ddl-auto=create
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
