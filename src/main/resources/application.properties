spring.profiles.active=local
spring.application.name=dateon
dateon.ai.service-url=${AI_SERVICE_URL:http://127.0.0.1:8000/predict_compatibility}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/Dateon}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASS:4567}
spring.jpa.hibernate.ddl-auto=create
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Logging Configuration
logging.level.org.hibernate.SQL=DEBUG
# BasicBinder TRACE removed to prevent plaintext passwords in logs
logging.level.org.springframework.web=DEBUG
logging.level.com.example.dateon=DEBUG

#spring.server = 9020
#Kafka
spring.kafka.bootstrap-servers=${KAFKA_URL:localhost:9092}
# Producer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer


# Consumer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.group-id=user-ai-group
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.enable-auto-commit=true
spring.kafka.consumer.auto-commit-interval=1000
spring.kafka.consumer.auto-offset-reset=latest

# JWT Configuration - Use a static secret key (Base64 encoded, at least 256 bits for HS256)
jwt.secret=YTJlOGI0ZjVjNzEyZDM2OWU4YWIxY2Q1ZjA5MTIzNDU2Nzg5MGFiY2RlZjAxMjM0NTY3ODlhYmNkZWYwMTIz

# Actuator Endpoints - For logging
management.endpoints.web.exposure.include=health,info
logging.file.name=logs/app.log

# Multipart File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Cloudinary Configuration
cloudinary.cloud_name=${CLOUDINARY_CLOUD_NAME:dummy_cloud_name}
cloudinary.api_key=${CLOUDINARY_API_KEY:dummy_api_key}
cloudinary.api_secret=${CLOUDINARY_API_SECRET:dummy_api_secret}
